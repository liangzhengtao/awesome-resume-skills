<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fff5f5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle pattern overlay -->
  <g opacity="0.08">
    <circle cx="100" cy="50" r="80" fill="white"/>
    <circle cx="300" cy="250" r="60" fill="white"/>
    <circle cx="900" cy="80" r="100" fill="white"/>
    <circle cx="1100" cy="220" r="70" fill="white"/>
    <circle cx="600" cy="280" r="40" fill="white"/>
  </g>

  <!-- Decorative lines -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="white" stroke-width="1"/>
  </g>

  <!-- Icon -->
  <text x="140" y="170" font-size="80" text-anchor="middle" fill="white" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">📄</text>

  <!-- Title -->
  <text x="600" y="130" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Awesome Resume Skills</text>

  <!-- Subtitle -->
  <text x="600" y="180" font-size="20" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">12 AI Skills for Traditional, Creative &amp; Technical Resumes</text>

  <!-- Category badges -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <rect x="290" y="210" width="120" height="32" rx="16" fill="rgba(255,255,255,0.2)"/>
    <text x="350" y="231" text-anchor="middle" fill="white">传统简历</text>

    <rect x="430" y="210" width="120" height="32" rx="16" fill="rgba(255,255,255,0.2)"/>
    <text x="490" y="231" text-anchor="middle" fill="white">创意简历</text>

    <rect x="570" y="210" width="120" height="32" rx="16" fill="rgba(255,255,255,0.2)"/>
    <text x="630" y="231" text-anchor="middle" fill="white">技术简历</text>

    <rect x="710" y="210" width="130" height="32" rx="16" fill="rgba(255,255,255,0.2)"/>
    <text x="775" y="231" text-anchor="middle" fill="white">求职优化</text>
  </g>

  <!-- Career category label -->
  <rect x="530" y="260" width="140" height="26" rx="13" fill="rgba(0,0,0,0.15)"/>
  <text x="600" y="278" font-size="12" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">📂 Career</text>
</svg>
