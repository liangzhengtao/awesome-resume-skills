name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint all markdown files
        run: markdownlint '**/*.md' --ignore node_modules --config .markdownlint.json

  structure:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          files=(
            "README.md"
            "README.zh.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            "banner.svg"
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
            echo "OK: $file"
          done

      - name: Check skill files exist
        run: |
          skills=(
            "skills/传统简历/professional-resume.md"
            "skills/传统简历/academic-cv.md"
            "skills/传统简历/federal-resume.md"
            "skills/创意简历/infographic-resume.md"
            "skills/创意简历/portfolio-resume.md"
            "skills/创意简历/video-resume.md"
            "skills/技术简历/software-engineer.md"
            "skills/技术简历/data-scientist.md"
            "skills/技术简历/devops-engineer.md"
            "skills/求职优化/ats-optimization.md"
            "skills/求职优化/cover-letter.md"
            "skills/求职优化/linkedin-optimization.md"
          )
          for skill in "${skills[@]}"; do
            if [ ! -f "$skill" ]; then
              echo "ERROR: Missing skill file: $skill"
              exit 1
            fi
            echo "OK: $skill"
          done

      - name: Check minimum line count
        run: |
          min_lines=150
          failed=0
          for file in skills/*/*.md; do
            lines=$(wc -l < "$file")
            if [ "$lines" -lt "$min_lines" ]; then
              echo "FAIL: $file has $lines lines (minimum: $min_lines)"
              failed=1
            else
              echo "OK: $file ($lines lines)"
            fi
          done
          exit $failed

      - name: Check 中文版本 section exists
        run: |
          failed=0
          for file in skills/*/*.md; do
            if ! grep -q "中文版本" "$file"; then
              echo "FAIL: $file missing 中文版本 section"
              failed=1
            else
              echo "OK: $file has 中文版本 section"
            fi
          done
          exit $failed
